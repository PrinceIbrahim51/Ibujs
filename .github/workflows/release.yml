# Publishes all @ibujs packages (and create-ibujs) to npm when a tag like v0.7.0 is pushed.
# Uses npm trusted publishing (OIDC): no long-lived npm token is stored. Every release gets a
# provenance statement linking the package to this repository, workflow and commit.
# One-time setup: see docs/RELEASING.md.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Tag must match package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
      - run: node scripts/release.mjs --verify
      - name: Publish (dependencies first)
        env:
          # Only needed if npm requires a token for a package's very first publish; leave unset otherwise.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in ui server ai cli create-ibujs; do
            npm publish ".release/$pkg" --provenance --access public
          done
